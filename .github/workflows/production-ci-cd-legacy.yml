name: Production CI/CD

on:
  workflow_dispatch:
  # pull_request:
  #   branches:
  #     - main
  # push:
  #   branches:
  #     - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout main for production build
        uses: actions/checkout@v6
        with:
          ref: main
          path: repo-main

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: repo-main/package-lock.json

      - name: Install production dependencies
        working-directory: repo-main
        run: npm ci

      - name: Lint production app
        working-directory: repo-main
        run: npm run lint --if-present

      - name: Build production app from main
        working-directory: repo-main
        run: npm run build

      - name: Move production build to final-dist
        run: |
          mkdir -p final-dist
          cp -R repo-main/dist/. final-dist/

      - name: Upload deploy bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: final-dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Download deploy bundle
        uses: actions/download-artifact@v4
        with:
          name: site
          path: final-dist

      - name: Checkout publish repo
        uses: actions/checkout@v6
        with:
          repository: igawaclawska/igawaclawska.github.io
          ref: gh-pages
          path: publish-repo
          token: ${{ secrets.PUBLISH_TOKEN }}
          fetch-depth: 0

      - name: Replace published files
        run: |
          find publish-repo -mindepth 1 -maxdepth 1 ! -name .git ! -name CNAME -exec rm -rf {} +
          cp -R final-dist/. publish-repo/

      - name: Commit and push
        working-directory: publish-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push origin gh-pages
