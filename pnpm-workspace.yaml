# Fail if a package's publish trust evidence drops compared to earlier releases.
trustPolicy: no-downgrade
# Legitimate backports to older release lines, flagged because newer lines publish with stronger trust evidence.
# semver@6.3.1: 6.x ReDoS fix published by an npm CLI maintainer. vite@6.4.1: published by vitebot with provenance.
trustPolicyExclude:
  - semver@6.3.1
  - vite@6.4.1

# Only install versions published at least 24 hours ago. Set explicitly so it is enforced strictly.
minimumReleaseAge: 1440

# Dependencies allowed to run install scripts. Anything not listed fails the install.
allowBuilds:
  esbuild: true
  unrs-resolver: true
  protobufjs: false
  '@firebase/util': false
